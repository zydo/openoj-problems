<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- edges -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="260" y1="48" x2="150" y2="118"/>
    <line x1="260" y1="48" x2="370" y2="118"/>
    <line x1="150" y1="148" x2="90" y2="208"/>
    <line x1="150" y1="148" x2="210" y2="208"/>
    <line x1="370" y1="148" x2="310" y2="208"/>
    <line x1="370" y1="148" x2="430" y2="208"/>
    <line x1="90" y1="238" x2="40" y2="248" stroke="none"/>
  </g>
  <!-- extra edges for nodes 9 and 2 under node 4 -->
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="210" y1="238" x2="180" y2="252"/>
    <line x1="210" y1="238" x2="240" y2="252"/>
  </g>
  <!-- nodes -->
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="260" cy="40" r="18"/>
    <circle cx="150" cy="110" r="18"/>
    <circle cx="370" cy="110" r="18"/>
    <circle cx="90" cy="185" r="18"/>
    <circle cx="210" cy="185" r="18"/>
    <circle cx="310" cy="185" r="18"/>
    <circle cx="430" cy="185" r="18"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="180" cy="240" r="16"/>
    <circle cx="240" cy="240" r="16"/>
  </g>
  <!-- labels -->
  <g text-anchor="middle" fill="#1a2026">
    <text x="260" y="45">1</text>
    <text x="150" y="115">5</text>
    <text x="370" y="115">3</text>
    <text x="90" y="190">9</text>
    <text x="210" y="190">4</text>
    <text x="310" y="190">10</text>
    <text x="430" y="190">6</text>
    <text x="180" y="245">2</text>
    <text x="240" y="245">9</text>
  </g>
  <!-- start marker -->
  <circle cx="370" cy="110" r="22" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="470" y="60" fill="#c0392b" font-size="12">start = 3</text>
</svg>
