name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the pinned all-in-one formatter image
        run: docker build -f scripts/format.Dockerfile -t openoj-format .
      - name: Format check (whole set, always, pinned container)
        run: docker run --rm -v "$PWD":/repo -w /repo openoj-format python3 scripts/format.py --check

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the pinned all-in-one formatter image
        run: docker build -f scripts/format.Dockerfile -t openoj-format .
      - name: Static completeness check (whole set, always, pinned container)
        # check.py regenerates starters through the pinned formatters, so it
        # must run where those formatters exist — same image as the format job.
        run: docker run --rm -v "$PWD":/repo -w /repo openoj-format python3 scripts/check.py --skip-runtime

  runtime:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v5
        with:
          path: problems-repo
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: zydo/openoj
          path: openoj
      - name: Detect changed problems
        id: changed
        run: |
          cd problems-repo
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            changed=all
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" \
              | grep -E '^problems/[0-9]{4}_[^/]+/' \
              | cut -d/ -f2 | sort -u | paste -sd, -)
          fi
          # Non-problem pushes (workflow, scripts, docs) touch no bundles —
          # nothing to judge. The full set is verified when it is first
          # imported (before = zero sha) or on demand.
          if [ -n "$changed" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "keys=$changed" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "keys=" >> "$GITHUB_OUTPUT"
          fi
      - name: Start OpenOJ serving this problem set
        if: steps.changed.outputs.skip != 'true'
        run: |
          cd openoj
          OPENOJ_PROBLEMS_PATH="$GITHUB_WORKSPACE/problems-repo/problems" \
          OPENOJ_PROBLEMS=/problems \
          docker compose up -d --build api web runner 2>&1 | tail -5
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS http://localhost:8080/api/health
      - name: Judge changed problems' solutions
        if: steps.changed.outputs.skip != 'true'
        run: |
          python3 problems-repo/scripts/check.py --problems="${{ steps.changed.outputs.keys }}"
      - name: Logs on failure
        if: failure() && steps.changed.outputs.skip != 'true'
        run: cd openoj && docker compose logs api runner | tail -80
