<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect x="0" y="0" width="560" height="250" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2026"/>
    </marker>
  </defs>
  <!-- board window x=0..3, y=0..3 ; cell (x,y) at (60+44(x-0), 30+44(3-y)) -->
  <g stroke="#98a2ac" stroke-width="1.1">
    <rect x="60" y="30" width="44" height="44" fill="#ffffff"/>
    <rect x="104" y="30" width="44" height="44" fill="#e9eef4"/>
    <rect x="148" y="30" width="44" height="44" fill="#ffffff"/>
    <rect x="192" y="30" width="44" height="44" fill="#e9eef4"/>
    <rect x="60" y="74" width="44" height="44" fill="#e9eef4"/>
    <rect x="104" y="74" width="44" height="44" fill="#ffffff"/>
    <rect x="148" y="74" width="44" height="44" fill="#e9eef4"/>
    <rect x="192" y="74" width="44" height="44" fill="#ffffff"/>
    <rect x="60" y="118" width="44" height="44" fill="#ffffff"/>
    <rect x="104" y="118" width="44" height="44" fill="#e9eef4"/>
    <rect x="148" y="118" width="44" height="44" fill="#ffffff"/>
    <rect x="192" y="118" width="44" height="44" fill="#e9eef4"/>
    <rect x="60" y="162" width="44" height="44" fill="#e9eef4"/>
    <rect x="104" y="162" width="44" height="44" fill="#ffffff"/>
    <rect x="148" y="162" width="44" height="44" fill="#e9eef4"/>
    <rect x="192" y="162" width="44" height="44" fill="#ffffff"/>
  </g>
  <!-- path cells -->
  <g fill="#e8edfa" stroke="#4169E1" stroke-width="1.8">
    <rect x="60" y="74" width="44" height="44"/>
    <rect x="148" y="118" width="44" height="44"/>
    <rect x="60" y="162" width="44" height="44"/>
    <rect x="104" y="74" width="44" height="44"/>
    <rect x="148" y="162" width="44" height="44"/>
    <rect x="192" y="74" width="44" height="44"/>
    <rect x="104" y="118" width="44" height="44"/>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="82" y="220">0</text>
    <text x="126" y="220">1</text>
    <text x="170" y="220">2</text>
    <text x="214" y="220">3</text>
    <text x="48" y="190">0</text>
    <text x="48" y="146">1</text>
    <text x="48" y="102">2</text>
    <text x="48" y="58">3</text>
  </g>
  <!-- hops -->
  <g fill="none" stroke-width="1.8">
    <path d="M 157 59 L 95 89" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 95 103 L 157 133" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 157 147 L 95 177" stroke="#4169E1" marker-end="url(#arrowA)"/>
    <path d="M 89 171 L 119 109" stroke="#1a2026" stroke-dasharray="5 3" marker-end="url(#arrowB)"/>
    <path d="M 133 109 L 163 171" stroke="#1a2026" stroke-dasharray="5 3" marker-end="url(#arrowB)"/>
    <path d="M 177 171 L 207 109" stroke="#1a2026" stroke-dasharray="5 3" marker-end="url(#arrowB)"/>
    <path d="M 201 103 L 139 133" stroke="#4169E1" marker-end="url(#arrowA)"/>
  </g>
  <g font-size="11.5" font-weight="600">
    <text x="120" y="61" fill="#4169E1">1</text>
    <text x="120" y="131" fill="#4169E1">2</text>
    <text x="142" y="168" fill="#4169E1">3</text>
    <text x="103" y="146" fill="#1a2026">4</text>
    <text x="135" y="146" fill="#1a2026">5</text>
    <text x="205" y="146" fill="#1a2026">6</text>
    <text x="164" y="105" fill="#4169E1">7</text>
  </g>
  <circle cx="170" cy="52" r="9" fill="#4169E1"/>
  <text x="170" y="56.5" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">K</text>
  <g fill="#1a2026">
    <circle cx="82" cy="184" r="9"/>
    <circle cx="126" cy="140" r="9"/>
    <circle cx="214" cy="96" r="9"/>
  </g>
  <g fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">
    <text x="82" y="188.5">0</text>
    <text x="126" y="144.5">1</text>
    <text x="214" y="100.5">2</text>
  </g>
  <!-- legend -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="320" y="48">Alice (solid blue) spends</text>
    <text x="320" y="66">hops 1-3 clearing pawn 0</text>
    <text x="320" y="84">at (0,0), then hop 7 takes</text>
    <text x="320" y="102">pawn 1 at (1,1).</text>
    <text x="320" y="120">Bob (dashed) uses hops 4-6</text>
    <text x="320" y="138">on pawn 2 at (3,2).</text>
    <text x="320" y="156" font-weight="600" fill="#1a2026">Total: 3 + 3 + 1 = 7 hops.</text>
  </g>
</svg>
