<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="1000" height="450" fill="#ffffff"/>
  <text x="120" y="34" fill="#5c6b76" font-size="12.5">the graph — each edge labelled index · weight</text>
  <g fill="none">
    <line x1="160.0" y1="165.0" x2="280.0" y2="165.0" stroke="#4169E1" stroke-width="2.8"/>
    <line x1="317.3" y1="155.0" x2="437.7" y2="85.0" stroke="#4169E1" stroke-width="2.8"/>
    <line x1="442.7" y1="90.8" x2="312.3" y2="259.2" stroke="#b57f30" stroke-width="2.2"/>
    <line x1="156.5" y1="176.3" x2="283.5" y2="263.7" stroke="#b57f30" stroke-width="2.2"/>
    <path d="M 159.9 167.4 Q 300 215 450.1 202.6" stroke="#4169E1" stroke-width="2.8"/>
    <line x1="300.0" y1="185.0" x2="300.0" y2="255.0" stroke="#9aa7b0" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="457.3" y1="94.9" x2="467.7" y2="185.1" stroke="#9aa7b0" stroke-width="1.6" stroke-dasharray="5 4"/>
  </g>
  <g fill="#5c6b76" font-size="11.5" text-anchor="middle">
    <text x="220" y="156">0 · 2</text>
    <text x="368" y="106">1 · 2</text>
    <text x="350" y="172">2 · 3</text>
    <text x="234" y="240">3 · 3</text>
    <text x="240" y="208">4 · 5</text>
    <text x="340" y="270">5 · 4</text>
    <text x="495" y="145">6 · 8</text>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="140" cy="165" r="16"/>
    <circle cx="300" cy="165" r="16"/>
    <circle cx="455" cy="75" r="16"/>
    <circle cx="300" cy="275" r="16"/>
    <circle cx="470" cy="205" r="16"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="140" y="170">0</text><text x="300" y="170">1</text><text x="455" y="80">2</text><text x="300" y="280">3</text><text x="470" y="210">4</text>
  </g>
  <!-- legend -->
  <g font-size="12" fill="#5c6b76">
    <line x1="130" y1="345" x2="165" y2="345" stroke="#4169E1" stroke-width="2.8"/>
    <text x="173" y="349">critical — edges 0, 1 and 4 sit in every MST</text>
    <line x1="130" y1="371" x2="165" y2="371" stroke="#b57f30" stroke-width="2.2"/>
    <text x="173" y="375">pseudo-critical — edges 2 and 3 sit in only some MSTs</text>
    <line x1="130" y1="397" x2="165" y2="397" stroke="#9aa7b0" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="173" y="401">edges 5 and 6 appear in no MST</text>
  </g>
  <!-- the two MSTs, each of weight 12 -->
  <g font-size="11" fill="#5c6b76" text-anchor="middle">
    <text x="632" y="122">MST — edges 0, 1, 2, 4</text>
    <text x="872" y="122">MST — edges 0, 1, 3, 4</text>
  </g>
  <defs>
    <g id="mini">
      <g fill="none" stroke="#4169E1" stroke-width="1.9">
        <line x1="75.0" y1="73.0" x2="119.0" y2="73.0"/>
        <line x1="143.2" y1="66.4" x2="188.8" y2="39.6"/>
        <line x1="192.1" y1="43.3" x2="139.9" y2="110.7"/>
        <line x1="72.7" y1="80.4" x2="121.3" y2="113.6"/>
        <line x1="74.9" y1="74.5" x2="194.1" y2="88.5"/>
        <line x1="132.0" y1="86.0" x2="132.0" y2="108.0"/>
        <line x1="201.6" y1="45.9" x2="205.4" y2="77.1"/>
      </g>
      <g stroke="#42525e" stroke-width="1.3" fill="#ffffff">
        <circle cx="62" cy="73" r="10"/><circle cx="132" cy="73" r="10"/><circle cx="200" cy="33" r="10"/><circle cx="132" cy="121" r="10"/><circle cx="207" cy="90" r="10"/>
      </g>
      <g text-anchor="middle" fill="#1a2026" font-weight="600" font-size="9.5">
        <text x="62" y="76.5">0</text><text x="132" y="76.5">1</text><text x="200" y="36.5">2</text><text x="132" y="124.5">3</text><text x="207" y="93.5">4</text>
      </g>
    </g>
  </defs>
  <!-- MST keeping edges 0, 1, 2, 4 -->
  <g transform="translate(515,150)"><use href="#mini"/>
    <line x1="72.7" y1="80.4" x2="121.3" y2="113.6" stroke="#ffffff" stroke-width="2.4"/>
    <line x1="132.0" y1="86.0" x2="132.0" y2="108.0" stroke="#ffffff" stroke-width="2.4"/>
    <line x1="201.6" y1="45.9" x2="205.4" y2="77.1" stroke="#ffffff" stroke-width="2.4"/>
  </g>
  <!-- MST keeping edges 0, 1, 3, 4 -->
  <g transform="translate(755,150)"><use href="#mini"/>
    <line x1="192.1" y1="43.3" x2="139.9" y2="110.7" stroke="#ffffff" stroke-width="2.4"/>
    <line x1="132.0" y1="86.0" x2="132.0" y2="108.0" stroke="#ffffff" stroke-width="2.4"/>
    <line x1="201.6" y1="45.9" x2="205.4" y2="77.1" stroke="#ffffff" stroke-width="2.4"/>
  </g>
  <text x="745" y="330" text-anchor="middle" fill="#1a2026" font-weight="600" font-size="12.5">every MST weighs 12 and keeps edges 0, 1 and 4</text>
</svg>
