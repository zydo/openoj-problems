<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="640" height="240" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <line x1="30" y1="200" x2="610" y2="200" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#4169E1" stroke-width="2" fill="none">
    <path d="M 60 190 Q 76.5 155 93 190" marker-end="url(#arrow)"/>
    <path d="M 93 190 Q 126 140 159 190" marker-end="url(#arrow)"/>
    <path d="M 159 190 Q 192 140 225 190" marker-end="url(#arrow)"/>
    <path d="M 225 190 Q 274.5 125 324 190" marker-end="url(#arrow)"/>
    <path d="M 324 190 Q 373.5 125 423 190" marker-end="url(#arrow)"/>
    <path d="M 423 190 Q 489 110 555 190" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#4169E1" text-anchor="middle" font-weight="600">
    <text x="76.5" y="157">1</text>
    <text x="126" y="142">2</text>
    <text x="192" y="142">2</text>
    <text x="274.5" y="127">3</text>
    <text x="373.5" y="127">3</text>
    <text x="489" y="112">4</text>
  </g>
  <g>
    <circle cx="60" cy="200" r="11" fill="#4169E1"/>
    <circle cx="93" cy="200" r="11" fill="#4169E1"/>
    <circle cx="159" cy="200" r="11" fill="#4169E1"/>
    <circle cx="225" cy="200" r="11" fill="#4169E1"/>
    <circle cx="324" cy="200" r="11" fill="#4169E1"/>
    <circle cx="423" cy="200" r="11" fill="#4169E1"/>
    <circle cx="489" cy="200" r="11" fill="#ffffff" stroke="#42525e" stroke-width="1.4" stroke-dasharray="3 2"/>
    <circle cx="555" cy="200" r="11" fill="#4169E1"/>
  </g>
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="60" y="228">0</text>
    <text x="93" y="228">1</text>
    <text x="159" y="228">3</text>
    <text x="225" y="228">5</text>
    <text x="324" y="228">8</text>
    <text x="423" y="228">11</text>
    <text x="489" y="228">13</text>
    <text x="555" y="228">15</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="30" y="34">One arc per hop. Neighbouring arcs differ in length by at most one</text>
    <text x="30" y="50">(1, 2, 2, 3, 3, 4). Position 13 is flown over: the hop of 4 out of</text>
    <text x="30" y="66">position 11 comes down on 15 directly. The table records, for each</text>
    <text x="30" y="82">stone, every hop length that can finish on it; the crossing works</text>
    <text x="30" y="98">because the final stone ends up with a non-empty entry.</text>
  </g>
</svg>
