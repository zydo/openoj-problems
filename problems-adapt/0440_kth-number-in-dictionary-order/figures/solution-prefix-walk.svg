<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <g font-size="12.5" fill="#5c6b76">
    <text x="40" y="26">Growing a spelling one digit at a time, with n = 12. Reading prefix-first</text>
    <text x="40" y="42">gives 1, 10, 11, 12, 2, 3, … — so position 4 is 12.</text>
  </g>
  <!-- growth edges from 1 to 10, 11, 12 -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="190" y1="82" x2="130" y2="150"/>
    <line x1="200" y1="84" x2="200" y2="150"/>
    <line x1="210" y1="82" x2="270" y2="150"/>
  </g>
  <!-- the walk: step into the branch, then two steps right -->
  <line x1="182" y1="90" x2="132" y2="145" stroke="#4169E1" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="142" y1="178" x2="176" y2="178" stroke="#4169E1" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="212" y1="178" x2="246" y2="178" stroke="#4169E1" stroke-width="2.4" marker-end="url(#arrow)"/>
  <g text-anchor="middle" font-weight="600">
    <circle cx="200" cy="66" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="200" y="71" fill="#1a2026">1</text>
    <circle cx="430" cy="66" r="20" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="430" y="71" fill="#1a2026">2</text>
    <text x="492" y="71" fill="#5c6b76" font-weight="400">3 … 9</text>
    <circle cx="120" cy="178" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <text x="120" y="183" fill="#1a2026">10</text>
    <circle cx="196" cy="178" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
    <text x="196" y="183" fill="#1a2026">11</text>
    <circle cx="272" cy="178" r="20" fill="#4169E1"/>
    <text x="272" y="183" fill="#ffffff">12</text>
  </g>
  <!-- branch bracket -->
  <path d="M 96 208 H 90 V 232 H 302 V 208 H 296" fill="none" stroke="#4169E1" stroke-width="1.6"/>
  <text x="196" y="252" text-anchor="middle" fill="#4169E1" font-size="12.5">branch of 1 holds 4 numbers — bigger than the 3 steps still owed</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="360" y="126">Appending a digit to 2 would</text>
    <text x="360" y="142">give 20 or more, past n, so the</text>
    <text x="360" y="158">branch of 2 is the single number.</text>
    <text x="360" y="190">Since the branch of 1 does not fit</text>
    <text x="360" y="206">the remaining budget, the walk</text>
    <text x="360" y="222">enters it and pays one step per</text>
    <text x="360" y="238">move right, stopping on 12.</text>
  </g>
</svg>
