<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 825 232" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- day separators -->
  <g stroke="#e3e6ea" stroke-dasharray="3 3">
    <line x1="50" y1="40" x2="50" y2="172"/>
    <line x1="175" y1="40" x2="175" y2="172"/>
    <line x1="300" y1="40" x2="300" y2="172"/>
    <line x1="425" y1="40" x2="425" y2="172"/>
    <line x1="550" y1="40" x2="550" y2="172"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="112.5" y="194">day 1</text><text x="237.5" y="194">day 2</text><text x="362.5" y="194">day 3</text><text x="487.5" y="194">day 4</text><text x="612.5" y="194">day 5</text>
  </g>
  <!-- window bars; worked day highlighted -->
  <rect x="50" y="48" width="375" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1"/>
  <rect x="50" y="48" width="115" height="30" rx="4" fill="#4169E1"/>
  <text x="237.5" y="68" fill="#1a2026">window 1: days 1–3</text>
  <rect x="175" y="94" width="375" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1"/>
  <rect x="175" y="94" width="115" height="30" rx="4" fill="#4169E1"/>
  <text x="362.5" y="114" fill="#1a2026">window 2: days 2–4</text>
  <rect x="300" y="140" width="375" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1"/>
  <rect x="300" y="140" width="115" height="30" rx="4" fill="#4169E1"/>
  <text x="487.5" y="160" fill="#1a2026">window 3: days 3–5</text>
  <!-- work markers -->
  <g fill="#ffffff" font-weight="700" text-anchor="middle">
    <text x="107" y="68">day 1</text>
    <text x="232" y="114">day 2</text>
    <text x="357" y="160">day 3</text>
  </g>
  <text x="412.5" y="222" text-anchor="middle" fill="#5c6b76">one task per day — work on days 1, 2, 3 and finish all three</text>
</svg>
