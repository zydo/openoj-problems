<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- 3x6 grid: # blocked, . usable, picks highlighted -->
  <g stroke="#c8cfd6" stroke-width="1">
    <rect x="36" y="28" width="56" height="56" fill="#e3e6ea"/><rect x="92" y="28" width="56" height="56" fill="#e3e6ea"/><rect x="148" y="28" width="56" height="56" fill="#ffffff"/><rect x="204" y="28" width="56" height="56" fill="#e3e6ea"/><rect x="260" y="28" width="56" height="56" fill="#ffffff"/><rect x="316" y="28" width="56" height="56" fill="#e3e6ea"/>
    <rect x="36" y="84" width="56" height="56" fill="#e3e6ea"/><rect x="92" y="84" width="56" height="56" fill="#e3e6ea"/><rect x="148" y="84" width="56" height="56" fill="#e3e6ea"/><rect x="204" y="84" width="56" height="56" fill="#e3e6ea"/><rect x="260" y="84" width="56" height="56" fill="#e3e6ea"/><rect x="316" y="84" width="56" height="56" fill="#ffffff"/>
    <rect x="36" y="140" width="56" height="56" fill="#e3e6ea"/><rect x="92" y="140" width="56" height="56" fill="#e3e6ea"/><rect x="148" y="140" width="56" height="56" fill="#e3e6ea"/><rect x="204" y="140" width="56" height="56" fill="#ffffff"/><rect x="260" y="140" width="56" height="56" fill="#e3e6ea"/><rect x="316" y="140" width="56" height="56" fill="#ffffff"/>
  </g>
  <g fill="#5c6b76" font-weight="700" font-size="18" text-anchor="middle">
    <text x="64" y="62">#</text><text x="120" y="62">#</text><text x="232" y="62">#</text><text x="344" y="62">#</text>
    <text x="64" y="118">#</text><text x="120" y="118">#</text><text x="176" y="118">#</text><text x="232" y="118">#</text><text x="288" y="118">#</text>
    <text x="64" y="174">#</text><text x="120" y="174">#</text><text x="176" y="174">#</text><text x="288" y="174">#</text>
  </g>
  <g fill="#c3cad1">
    <circle cx="176" cy="56" r="3"/><circle cx="288" cy="56" r="3"/><circle cx="344" cy="112" r="3"/><circle cx="232" cy="168" r="3"/><circle cx="344" cy="168" r="3"/>
  </g>
  <!-- picks at (0,2) (0,4) (2,3) (2,5) -->
  <g>
    <circle cx="176" cy="56" r="17" fill="#4169E1"/>
    <circle cx="288" cy="56" r="17" fill="#4169E1"/>
    <circle cx="232" cy="168" r="17" fill="#4169E1"/>
    <circle cx="344" cy="168" r="17" fill="#4169E1"/>
    <g fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <circle cx="176" cy="50" r="4" stroke="none"/><path d="M 169 62 a 7 7 0 0 1 14 0" fill="none"/>
      <circle cx="288" cy="50" r="4" stroke="none"/><path d="M 281 62 a 7 7 0 0 1 14 0" fill="none"/>
      <circle cx="232" cy="162" r="4" stroke="none"/><path d="M 225 174 a 7 7 0 0 1 14 0" fill="none"/>
      <circle cx="344" cy="162" r="4" stroke="none"/><path d="M 337 174 a 7 7 0 0 1 14 0" fill="none"/>
    </g>
  </g>
  <g font-size="12.5" fill="#1a2026">
    <rect x="404" y="46" width="14" height="14" fill="#e3e6ea" stroke="#c3cad1"/>
    <text x="426" y="58">blocked cell (#)</text>
    <rect x="404" y="70" width="14" height="14" fill="#ffffff" stroke="#c8cfd6"/>
    <text x="426" y="82">usable cell (.)</text>
    <circle cx="411" cy="99" r="7" fill="#4169E1"/>
    <text x="426" y="104">pick</text>
  </g>
  <text x="404" y="140" fill="#4169E1" font-weight="700" font-size="15">4 picks</text>
  <text x="404" y="162" fill="#5c6b76">no two share a row's</text>
  <text x="404" y="179" fill="#5c6b76">adjacent columns or sit</text>
  <text x="404" y="196" fill="#5c6b76">diagonally behind another</text>
</svg>
