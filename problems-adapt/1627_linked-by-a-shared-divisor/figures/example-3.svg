<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="300" fill="#ffffff"/>
  <line x1="400" y1="80" x2="260" y2="210" stroke="#42525e" stroke-width="1.8"/>
  <g stroke="#42525e" stroke-width="1.7" fill="#ffffff">
    <circle cx="120" cy="80" r="20"/>
    <circle cx="260" cy="80" r="20"/>
    <circle cx="400" cy="80" r="20"/>
    <circle cx="540" cy="80" r="20"/>
    <circle cx="120" cy="210" r="20"/>
    <circle cx="260" cy="210" r="20"/>
    <circle cx="400" cy="210" r="20"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="120" y="85">1</text> <text x="260" y="85">2</text> <text x="400" y="85">3</text> <text x="540" y="85">4</text> <text x="120" y="215">5</text> <text x="260" y="215">6</text> <text x="400" y="215">7</text>
  </g>
  <text x="330" y="272" text-anchor="middle" fill="#1a2026" font-weight="600">only 3 and 6 share a divisor above 2 — and no query asks about them</text>
  <text x="330" y="292" text-anchor="middle" fill="#5c6b76" font-size="12">queries [3,5], [5,3], [2,7], [6,7]: false</text>
</svg>
