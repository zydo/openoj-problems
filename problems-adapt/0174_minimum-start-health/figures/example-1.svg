<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 252" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- grid: path RIGHT, RIGHT, DOWN, DOWN -->
  <g stroke="#b9c4cd" fill="#ffffff">
    <rect x="105" y="30" width="70" height="54" fill="#e5ebfa"/>
    <rect x="175" y="30" width="70" height="54" fill="#e5ebfa"/>
    <rect x="245" y="30" width="70" height="54" fill="#e5ebfa"/>
    <rect x="105" y="84" width="70" height="54"/>
    <rect x="175" y="84" width="70" height="54"/>
    <rect x="245" y="84" width="70" height="54" fill="#e5ebfa"/>
    <rect x="105" y="138" width="70" height="54"/>
    <rect x="175" y="138" width="70" height="54"/>
    <rect x="245" y="138" width="70" height="54" fill="#e5ebfa"/>
  </g>
  <rect x="105" y="30" width="210" height="162" fill="none" stroke="#1a2026" stroke-width="1.6"/>
  <g fill="#1a2026" text-anchor="middle">
    <text x="140" y="63">-4</text><text x="210" y="63">-7</text><text x="280" y="63">7</text>
    <text x="140" y="117">-4</text><text x="210" y="117">-8</text><text x="280" y="117">-6</text>
    <text x="140" y="175">-6</text><text x="210" y="175">0</text><text x="280" y="175">0</text>
  </g>
  <g stroke="#4169E1" stroke-width="2.4" fill="none">
    <line x1="160" y1="57" x2="190" y2="57" marker-end="url(#arrowA)"/>
    <line x1="230" y1="57" x2="260" y2="57" marker-end="url(#arrowA)"/>
    <line x1="280" y1="75" x2="280" y2="93" marker-end="url(#arrowA)"/>
    <line x1="280" y1="129" x2="280" y2="147" marker-end="url(#arrowA)"/>
  </g>
  <text x="140" y="22" text-anchor="middle" fill="#5c6b76" font-size="11.5">start</text>
  <text x="280" y="208" text-anchor="middle" fill="#5c6b76" font-size="11.5">finish</text>
  <text x="220" y="238" text-anchor="middle" fill="#5c6b76" font-size="12.5">with 12 starting health: 12 -&gt; 8 -&gt; 1 -&gt; 8 -&gt; 2 -&gt; 2, never below 1</text>
</svg>
