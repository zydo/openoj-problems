<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 388" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <line x1="50" y1="70" x2="182" y2="70" stroke="#4169E1" stroke-width="5" stroke-linecap="round"/>
  <text x="190" y="74" fill="#5c6b76" font-size="11">[0, 3]</text>
  <line x1="94" y1="114" x2="138" y2="114" stroke="#42525e" stroke-width="3" stroke-linecap="round"/>
  <text x="146" y="118" fill="#5c6b76" font-size="11">[1, 2]</text>
  <line x1="138" y1="158" x2="270" y2="158" stroke="#4169E1" stroke-width="5" stroke-linecap="round"/>
  <text x="278" y="162" fill="#5c6b76" font-size="11">[2, 5]</text>
  <line x1="226" y1="202" x2="490" y2="202" stroke="#4169E1" stroke-width="5" stroke-linecap="round"/>
  <text x="498" y="206" fill="#5c6b76" font-size="11">[4, 10]</text>
  <line x1="358" y1="246" x2="446" y2="246" stroke="#42525e" stroke-width="3" stroke-linecap="round"/>
  <text x="454" y="250" fill="#5c6b76" font-size="11">[7, 9]</text>
  <line x1="50" y1="286" x2="50" y2="294" stroke="#42525e"/><text x="50" y="312" text-anchor="middle" fill="#5c6b76" font-size="11">0</text>
  <line x1="94" y1="286" x2="94" y2="294" stroke="#42525e"/><text x="94" y="312" text-anchor="middle" fill="#5c6b76" font-size="11">1</text>
  <line x1="138" y1="286" x2="138" y2="294" stroke="#42525e"/><text x="138" y="312" text-anchor="middle" fill="#5c6b76" font-size="11">2</text>
  <line x1="182" y1="286" x2="182" y2="294" stroke="#42525e"/><text x="182" y="312" text-anchor="middle" fill="#5c6b76" font-size="11">3</text>
  <line x1="226" y1="286" x2="226" y2="294" stroke="#42525e"/><text x="226" y="312" text-anchor="middle" fill="#5c6b76" font-size="11">4</text>
  <line x1="270" y1="286" x2="270" y2="294" stroke="#42525e"/><text x="270" y="312" text-anchor="middle" fill="#5c6b76" font-size="11">5</text>
  <line x1="314" y1="286" x2="314" y2="294" stroke="#42525e"/><text x="314" y="312" text-anchor="middle" fill="#5c6b76" font-size="11">6</text>
  <line x1="358" y1="286" x2="358" y2="294" stroke="#42525e"/><text x="358" y="312" text-anchor="middle" fill="#5c6b76" font-size="11">7</text>
  <line x1="402" y1="286" x2="402" y2="294" stroke="#42525e"/><text x="402" y="312" text-anchor="middle" fill="#5c6b76" font-size="11">8</text>
  <line x1="446" y1="286" x2="446" y2="294" stroke="#42525e"/><text x="446" y="312" text-anchor="middle" fill="#5c6b76" font-size="11">9</text>
  <line x1="490" y1="286" x2="490" y2="294" stroke="#42525e"/><text x="490" y="312" text-anchor="middle" fill="#5c6b76" font-size="11">10</text>
  <line x1="50" y1="290" x2="490" y2="290" stroke="#42525e"/>
  <text x="40" y="350" fill="#5c6b76" font-size="12">Ordered by start, the sweep always grabs the interval reaching furthest past</text>
  <text x="40" y="368" fill="#5c6b76" font-size="12">the covered prefix (blue): 0 to 3, then out to 5, then out to 10 &#8212; 3 intervals.</text>
</svg>
