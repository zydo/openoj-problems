<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 272" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="380" height="272" fill="#ffffff"/>
  <!-- square of side 4: three single sticks and one edge made of a 1 and a 3 -->
  <g stroke="#1a2026" stroke-width="7" stroke-linecap="round">
    <line x1="265" y1="55" x2="265" y2="205"/>
    <line x1="265" y1="205" x2="115" y2="205"/>
    <line x1="115" y1="205" x2="115" y2="55"/>
  </g>
  <g fill="#1a2026">
    <circle cx="265" cy="64" r="6"/>
    <circle cx="256" cy="205" r="6"/>
    <circle cx="115" cy="196" r="6"/>
  </g>
  <!-- the split edge: sticks of length 1 and 3 -->
  <g stroke="#4169E1" stroke-width="7" stroke-linecap="round">
    <line x1="115" y1="55" x2="148" y2="55"/>
    <line x1="157" y1="55" x2="265" y2="55"/>
  </g>
  <g fill="#4169E1">
    <circle cx="124" cy="55" r="6"/>
    <circle cx="166" cy="55" r="6"/>
  </g>
  <g text-anchor="middle">
    <text x="190" y="36" fill="#4169E1" font-weight="600">1 + 3</text>
    <text x="292" y="134" fill="#5c6b76">4</text>
    <text x="190" y="232" fill="#5c6b76">4</text>
    <text x="88" y="134" fill="#5c6b76">4</text>
  </g>
  <text x="190" y="258" text-anchor="middle" fill="#5c6b76" font-size="12.5">all five sticks are spent, four to an edge: 1 + 3 + 4 + 4 + 4 = 4 × 4</text>
</svg>
