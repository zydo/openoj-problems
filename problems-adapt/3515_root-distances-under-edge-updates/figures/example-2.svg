<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 5, edges = [[1,2,4],[1,3,2],[3,5,6],[3,4,3]], queries = [[2,5],[2,2],[1,3,5,9],[2,5],[2,2]]; answers [8,4,11,4] (verified by simulation) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="320" y1="64" x2="150" y2="178"/>
    <line x1="320" y1="64" x2="450" y2="178"/>
    <line x1="450" y1="178" x2="350" y2="280"/>
    <line x1="450" y1="178" x2="550" y2="280"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="320" cy="64" r="21"/>
    <circle cx="150" cy="178" r="21"/>
    <circle cx="450" cy="178" r="21"/>
    <circle cx="350" cy="280" r="21"/>
    <circle cx="550" cy="280" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="320" y="69">1</text>
    <text x="150" y="183">2</text>
    <text x="450" y="183">3</text>
    <text x="350" y="285">4</text>
    <text x="550" y="285">5</text>
  </g>
  <text x="320" y="24" text-anchor="middle" fill="#5c6b76" font-size="11.5">root</text>
  <text x="218" y="112" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">4</text>
  <text x="404" y="112" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">2</text>
  <text x="384" y="226" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">3</text>
  <text x="516" y="226" text-anchor="middle" font-size="12" font-weight="600"><tspan fill="#5c6b76">6</tspan><tspan fill="#7a5a1e"> → 9</tspan></text>
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="150" y="224" fill="#5c6b76">d = 4</text>
    <text x="508" y="166" fill="#5c6b76">d = 2</text>
    <text x="350" y="324" fill="#5c6b76">d = 5</text>
    <text x="550" y="324"><tspan fill="#5c6b76">d = 8</tspan><tspan fill="#7a5a1e"> → 11</tspan></text>
  </g>
  <text x="320" y="350" text-anchor="middle" fill="#1a2026" font-size="13.5">answers <tspan fill="#4169E1" font-weight="700">8, 4, 11, 4</tspan> — the branch to node 2 never moves; d(5) = 2 + 9 = 11 after edge (3, 5) grows from 6 to 9</text>
</svg>
