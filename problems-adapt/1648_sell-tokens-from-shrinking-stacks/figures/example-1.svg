<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="560" height="330" fill="#ffffff"/>
  <!-- amber stack: 3 tokens, top 1 sold -->
  <g>
    <circle cx="150" cy="142" r="15" fill="#e8b93e" fill-opacity="0.85" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="118" y="147" text-anchor="end" fill="#1a2026" font-size="12.5">3</text>
    <circle cx="150" cy="172" r="15" fill="#e8b93e" stroke="#a8842a" stroke-width="1.5"/>
    <text x="118" y="177" text-anchor="end" fill="#5c6b76" font-size="12.5">2</text>
    <circle cx="150" cy="202" r="15" fill="#e8b93e" stroke="#a8842a" stroke-width="1.5"/>
    <text x="118" y="207" text-anchor="end" fill="#5c6b76" font-size="12.5">1</text>
    <text x="150" y="246" text-anchor="middle" fill="#1a2026" font-weight="600">amber ×3</text>
  </g>
  <!-- blue stack: 6 tokens, top 4 sold -->
  <g>
    <circle cx="330" cy="52" r="15" fill="#4169E1" fill-opacity="0.85" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="298" y="57" text-anchor="end" fill="#1a2026" font-size="12.5">6</text>
    <circle cx="330" cy="82" r="15" fill="#4169E1" fill-opacity="0.85" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="298" y="87" text-anchor="end" fill="#1a2026" font-size="12.5">5</text>
    <circle cx="330" cy="112" r="15" fill="#4169E1" fill-opacity="0.85" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="298" y="117" text-anchor="end" fill="#1a2026" font-size="12.5">4</text>
    <circle cx="330" cy="142" r="15" fill="#4169E1" fill-opacity="0.85" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="298" y="147" text-anchor="end" fill="#1a2026" font-size="12.5">3</text>
    <circle cx="330" cy="172" r="15" fill="#4169E1" stroke="#274db1" stroke-width="1.5"/>
    <text x="298" y="177" text-anchor="end" fill="#5c6b76" font-size="12.5">2</text>
    <circle cx="330" cy="202" r="15" fill="#4169E1" stroke="#274db1" stroke-width="1.5"/>
    <text x="298" y="207" text-anchor="end" fill="#5c6b76" font-size="12.5">1</text>
    <text x="330" y="246" text-anchor="middle" fill="#1a2026" font-weight="600">blue ×6</text>
  </g>
  <!-- each stack's prices = tokens left in it -->
  <text x="470" y="70" text-anchor="middle" fill="#5c6b76" font-size="11.5">price = tokens</text>
  <text x="470" y="86" text-anchor="middle" fill="#5c6b76" font-size="11.5">left in that stack</text>
  <path d="M 176 134 L 186 134 L 186 150 L 176 150" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 356 44 L 366 44 L 366 150 L 356 150" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="470" y="120" text-anchor="middle" fill="#c0392b" font-size="12">sold: 5 orders</text>
  <text x="470" y="140" text-anchor="middle" fill="#5c6b76" font-size="11.5">dashed ring</text>
  <text x="280" y="296" text-anchor="middle" fill="#1a2026" font-weight="600">sell from the tallest stack while it leads: 6 + 5 + 4 + 3 + 3 = 21</text>
</svg>
