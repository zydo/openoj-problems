<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 222" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="370" y="26" text-anchor="end" fill="#4169E1" font-weight="600">best single job: 9</text>
  <!-- timeline -->
  <line x1="40" y1="184" x2="370" y2="184" stroke="#1a2026" stroke-width="1.5"/>
  <g stroke="#1a2026">
    <line x1="50" y1="184" x2="50" y2="190"/>
    <line x1="130" y1="184" x2="130" y2="190"/>
    <line x1="210" y1="184" x2="210" y2="190"/>
    <line x1="290" y1="184" x2="290" y2="190"/>
    <line x1="370" y1="184" x2="370" y2="190"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-size="12.5">
    <text x="50" y="205">2</text>
    <text x="130" y="205">3</text>
    <text x="210" y="205">4</text>
    <text x="290" y="205">5</text>
    <text x="370" y="205">6</text>
    <text x="404" y="205" fill="#5c6b76">time</text>
  </g>
  <!-- job bars: chosen = accent -->
  <rect x="50" y="35" width="80" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1" stroke-width="1"/>
  <text x="60" y="55" fill="#5c6b76">job 1 — 7</text>
  <rect x="50" y="77" width="240" height="30" rx="4" fill="#e8edfb" stroke="#4169E1" stroke-width="1.8"/>
  <text x="60" y="97" fill="#1a2026" font-weight="600">job 2 — 9</text>
  <rect x="50" y="119" width="320" height="30" rx="4" fill="#f2f4f6" stroke="#c3cad1" stroke-width="1"/>
  <text x="60" y="139" fill="#5c6b76">job 3 — 5</text>
</svg>
