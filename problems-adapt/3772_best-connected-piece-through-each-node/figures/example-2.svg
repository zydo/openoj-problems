<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 5, edges = [[1,0],[1,2],[1,3],[3,4]], marked = [1,0,0,1,1]; best scores = [2,2,1,2,2]; best piece for 0/1/3/4 is {0,1,3,4} with score 2 (verified by brute force) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="270" y1="58" x2="110" y2="160"/>
    <line x1="270" y1="58" x2="270" y2="160"/>
    <line x1="270" y1="58" x2="430" y2="160"/>
    <line x1="430" y1="160" x2="430" y2="250"/>
  </g>
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="270" y1="58" x2="110" y2="160"/>
    <line x1="270" y1="58" x2="430" y2="160"/>
    <line x1="430" y1="160" x2="430" y2="250"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="110" cy="160" r="21"/>
    <circle cx="430" cy="160" r="21"/>
    <circle cx="430" cy="250" r="21"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.6">
    <circle cx="270" cy="58" r="21"/>
    <circle cx="270" cy="160" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="270" y="63">1</text>
    <text x="110" y="165">0</text>
    <text x="270" y="165">2</text>
    <text x="430" y="165">3</text>
    <text x="430" y="255">4</text>
  </g>
  <g font-size="12" font-weight="600">
    <text x="270" y="24" text-anchor="middle" fill="#5c6b76">unmarked</text>
    <text x="110" y="198" text-anchor="middle" fill="#4169E1">marked</text>
    <text x="270" y="198" text-anchor="middle" fill="#5c6b76">unmarked</text>
    <text x="466" y="164" fill="#4169E1">marked</text>
    <text x="466" y="254" fill="#4169E1">marked</text>
  </g>
  <text x="270" y="292" text-anchor="middle" fill="#1a2026" font-size="13.5">piece <tspan fill="#4169E1" font-weight="700">{0, 1, 3, 4}</tspan> (thick): 3 marked − 1 unmarked = score <tspan fill="#4169E1" font-weight="700">2</tspan>; node <tspan fill="#4169E1" font-weight="700">2</tspan> joins for only <tspan fill="#4169E1" font-weight="700">1</tspan></text>
</svg>
