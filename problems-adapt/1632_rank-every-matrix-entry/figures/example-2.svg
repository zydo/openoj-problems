<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <rect width="520" height="230" fill="#ffffff"/>
  <!-- input matrix -->
  <g stroke="#42525e" stroke-width="1.3">
<rect x="60" y="60" width="54" height="54" fill="#ffffff"/>
    <rect x="114" y="60" width="54" height="54" fill="#ffffff"/>
    <rect x="60" y="114" width="54" height="54" fill="#ffffff"/>
    <rect x="114" y="114" width="54" height="54" fill="#ffffff"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="87" y="91">-4</text> <text x="141" y="91">-4</text>
        <text x="87" y="145">-4</text> <text x="141" y="145">-4</text>
  </g>
  <line x1="200" y1="114" x2="256" y2="114" stroke="#42525e" stroke-width="1.7" marker-end="url(#a)"/>
  <!-- rank matrix -->
  <g stroke="#42525e" stroke-width="1.3">
<rect x="306" y="60" width="54" height="54" fill="#2e9e5b" fill-opacity="0.2"/>
    <rect x="360" y="60" width="54" height="54" fill="#2e9e5b" fill-opacity="0.2"/>
    <rect x="306" y="114" width="54" height="54" fill="#2e9e5b" fill-opacity="0.2"/>
    <rect x="360" y="114" width="54" height="54" fill="#2e9e5b" fill-opacity="0.2"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="333" y="91">1</text> <text x="387" y="91">1</text>
        <text x="333" y="145">1</text> <text x="387" y="145">1</text>
  </g>
  <g font-size="11.5">
    <rect x="450" y="56" width="14" height="14" fill="#2e9e5b" fill-opacity="0.2" stroke="#42525e" stroke-width="0.8"/>
    <text x="470" y="67" fill="#5c6b76">rank 1</text>
  </g>
  <text x="260" y="205" text-anchor="middle" fill="#1a2026" font-weight="600">all entries equal — one rank for the whole matrix</text>
</svg>
