<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="340" height="372" fill="#ffffff"/>
  <!-- gridlines -->
  <g stroke="#e6eaee" stroke-width="1">
    <line x1="80" y1="80" x2="80" y2="290"/><line x1="110" y1="80" x2="110" y2="290"/><line x1="140" y1="80" x2="140" y2="290"/><line x1="170" y1="80" x2="170" y2="290"/><line x1="200" y1="80" x2="200" y2="290"/><line x1="230" y1="80" x2="230" y2="290"/><line x1="260" y1="80" x2="260" y2="290"/><line x1="290" y1="80" x2="290" y2="290"/>
    <line x1="80" y1="290" x2="290" y2="290"/><line x1="80" y1="260" x2="290" y2="260"/><line x1="80" y1="230" x2="290" y2="230"/><line x1="80" y1="200" x2="290" y2="200"/><line x1="80" y1="170" x2="290" y2="170"/><line x1="80" y1="140" x2="290" y2="140"/><line x1="80" y1="110" x2="290" y2="110"/><line x1="80" y1="80" x2="290" y2="80"/>
  </g>
  <!-- axes -->
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="50" y1="320" x2="296" y2="320"/>
    <line x1="50" y1="320" x2="50" y2="76"/>
  </g>
  <g fill="#5c6b76" font-size="10.5" text-anchor="middle">
    <text x="50" y="336">0</text><text x="80" y="336">1</text><text x="110" y="336">2</text><text x="140" y="336">3</text><text x="170" y="336">4</text><text x="200" y="336">5</text><text x="230" y="336">6</text><text x="260" y="336">7</text><text x="290" y="336">8</text>
    <text x="38" y="324">0</text><text x="38" y="264">2</text><text x="38" y="204">4</text><text x="38" y="144">6</text><text x="38" y="84">8</text>
  </g>
  <!-- MST runs (manhattan lengths) -->
  <g stroke="#4169E1" stroke-width="2.2">
    <line x1="80" y1="290" x2="110" y2="200"/>
    <line x1="110" y1="200" x2="200" y2="230"/>
    <line x1="200" y1="230" x2="260" y2="140"/>
    <line x1="200" y1="230" x2="290" y2="290"/>
  </g>
  <g fill="#274db1" font-size="11.5">
    <text x="74" y="252" text-anchor="end">cost 4</text>
    <text x="159" y="202" text-anchor="middle">cost 4</text>
    <text x="218" y="177" text-anchor="end">cost 5</text>
    <text x="250" y="302" text-anchor="start">cost 5</text>
  </g>
  <!-- points -->
  <g fill="#1a2026">
    <circle cx="80" cy="290" r="4.5"/>
    <circle cx="110" cy="200" r="4.5"/>
    <circle cx="200" cy="230" r="4.5"/>
    <circle cx="260" cy="140" r="4.5"/>
    <circle cx="290" cy="290" r="4.5"/>
  </g>
  <text x="170" y="360" text-anchor="middle" fill="#1a2026" font-weight="600">minimum spanning tree: 4 + 4 + 5 + 5 = 18</text>
</svg>
