<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- n = 4, links = [[1,2,8],[3,4,2]]: two separate pairs, nothing on offer spans the gap -->
  <g stroke="#4169E1" stroke-width="2.6">
    <line x1="109" y1="60" x2="211" y2="60"/>
    <line x1="109" y1="180" x2="211" y2="180"/>
  </g>
  <g fill="#5c6b76" font-size="12.5" text-anchor="middle">
    <text x="160" y="50">8</text>
    <text x="160" y="170">2</text>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="90" cy="60" r="19"/>
    <circle cx="230" cy="60" r="19"/>
    <circle cx="90" cy="180" r="19"/>
    <circle cx="230" cy="180" r="19"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="90" y="65">1</text>
    <text x="230" y="65">2</text>
    <text x="90" y="185">3</text>
    <text x="230" y="185">4</text>
  </g>
  <text x="160" y="238" text-anchor="middle" fill="#5c6b76" font-size="12.5">nothing on offer runs between the 1-2 pair and the 3-4 pair, so the answer is -1</text>
</svg>
