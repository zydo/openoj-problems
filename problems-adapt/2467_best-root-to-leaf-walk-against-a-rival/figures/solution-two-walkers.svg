<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <!-- tree: 0-2, 2-4, 2-1, 1-3 -->
  <g stroke="#42525e" stroke-width="1.8">
    <line x1="220" y1="84" x2="220" y2="160"/>
    <line x1="220" y1="194" x2="120" y2="270"/>
    <line x1="220" y1="194" x2="330" y2="270"/>
    <line x1="330" y1="304" x2="330" y2="336"/>
  </g>
  <!-- Alice winning path 0-2-1-3 accent -->
  <g stroke="#4169E1" stroke-width="3.2" fill="none">
    <line x1="220" y1="84" x2="220" y2="160"/>
    <line x1="236" y1="204" x2="316" y2="262"/>
    <line x1="330" y1="304" x2="330" y2="336"/>
  </g>
  <!-- nodes: value + amount -->
  <g text-anchor="middle" font-weight="600">
    <circle cx="220" cy="66" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="220" y="72">0</text>
    <circle cx="220" cy="178" r="22" fill="#4169E1" stroke="#42525e" stroke-width="1.6"/><text x="220" y="184" fill="#ffffff">2</text>
    <circle cx="110" cy="286" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="110" y="292">4</text>
    <circle cx="330" cy="286" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/><text x="330" y="292">1</text>
  </g>
  <circle cx="330" cy="358" r="22" fill="#dbe4f6" stroke="#42525e" stroke-width="1.6"/>
  <text x="330" y="364" text-anchor="middle" font-weight="600">3</text>
  <!-- amounts -->
  <g font-size="12" fill="#5c6b76" text-anchor="middle">
    <text x="220" y="36">−4</text><text x="220" y="148">+6</text><text x="110" y="256">+2</text>
    <text x="330" y="256">−2</text><text x="376" y="330" text-anchor="start">+8</text>
  </g>
  <!-- Bob path arrows 1 -> 2 -> 0 -->
  <g stroke="#1a2026" stroke-width="1.8" fill="none" stroke-dasharray="5 4">
    <path d="M 316 268 Q 260 230 232 196" marker-end="url(#arrow)"/>
    <path d="M 220 156 Q 214 128 218 94" marker-end="url(#arrow)"/>
  </g>
  <text x="272" y="212" fill="#5c6b76" font-size="12.5">Bob: t=0 →</text>
  <text x="150" y="120" fill="#5c6b76" font-size="12.5">t=1 →</text>
  <!-- income notes -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="430" y="80">Alice depth 0 at node 0: Bob arrives</text>
    <text x="430" y="96">at t = 2, so she pays the full −4.</text>
    <text x="430" y="128">Both reach node 2 at t = 1 — the</text>
    <text x="430" y="144">+6 is shared, +3 each.</text>
    <text x="430" y="176">Bob opened node 1 at t = 0,</text>
    <text x="430" y="192">so Alice collects 0 there.</text>
    <text x="430" y="224">Node 3 is untouched by Bob:</text>
    <text x="430" y="240">the full +8.</text>
    <text x="430" y="272" fill="#4169E1" font-weight="600">Leaf 3 income: −4 + 3 + 0 + 8 = 7</text>
    <text x="430" y="300">Leaf 4 income: −4 + 3 + 2 = 1</text>
  </g>
</svg>
