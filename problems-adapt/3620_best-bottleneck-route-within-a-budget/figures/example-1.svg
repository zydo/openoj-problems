<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 272" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- edges = [[0,2,4],[2,4,9],[0,3,5],[3,4,7]], k = 12, node 1 offline with no links; 0-2-4 costs 13 &gt; k, 0-3-4 costs 12 with bottleneck min(5,7) = 5 (verified by path enumeration) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b57f30"/>
    </marker>
  </defs>
  <line x1="314.4" y1="54.1" x2="245.6" y2="115.9" stroke="#b57f30" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowW)"/>
  <line x1="245.6" y1="144.1" x2="314.4" y2="205.9" stroke="#b57f30" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowW)"/>
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="345.6" y1="54.1" x2="414.4" y2="115.9" marker-end="url(#arrowA)"/>
    <line x1="414.4" y1="144.1" x2="345.6" y2="205.9" marker-end="url(#arrowA)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="230" cy="130" r="21"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="330" cy="40" r="21"/>
    <circle cx="430" cy="130" r="21"/>
    <circle cx="330" cy="220" r="21"/>
  </g>
  <circle cx="80" cy="50" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="330" y="45">0</text>
    <text x="230" y="135">2</text>
    <text x="430" y="135">3</text>
    <text x="330" y="225">4</text>
    <text x="80" y="55">1</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="262" y="80" fill="#7a5a1e" font-weight="600">4</text>
    <text x="262" y="184" fill="#7a5a1e" font-weight="600">9</text>
    <text x="396" y="80" fill="#4169E1" font-weight="600">5</text>
    <text x="396" y="184" fill="#4169E1" font-weight="600">7</text>
  </g>
  <text x="80" y="92" fill="#7a5a1e" font-size="11.5" text-anchor="middle" font-weight="600">offline</text>
  <g font-size="12.5" fill="#7a5a1e">
    <text x="30" y="120">0 → 2 → 4:</text>
    <text x="30" y="138">4 + 9 = 13 &gt; k</text>
  </g>
  <text x="310" y="260" text-anchor="middle" fill="#1a2026" font-size="13.5">0 → 3 → 4 costs 5 + 7 = 12 ≤ k = 12, so the best bottleneck is min(5, 7) = <tspan fill="#4169E1" font-weight="700">5</tspan></text>
</svg>
