<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 272" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- edges = [[0,1,9],[1,4,4],[0,3,7],[3,2,6],[2,4,5],[3,4,8]], k = 13, node 2 offline; the only qualifying route 0-1-4 costs 13 with bottleneck 4 (verified by path enumeration) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b57f30"/>
    </marker>
  </defs>
  <g stroke="#4169E1" stroke-width="3.2">
    <line x1="79" y1="101.1" x2="191" y2="48.9" marker-end="url(#arrowA)"/>
    <line x1="230.4" y1="44.9" x2="479.6" y2="105.1" marker-end="url(#arrowA)"/>
  </g>
  <line x1="230.8" y1="183" x2="329.2" y2="197" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="368" y1="189.2" x2="482" y2="120.8" stroke="#42525e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="79" y1="118.9" x2="191" y2="171.1" stroke="#b57f30" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowW)"/>
  <line x1="230.4" y1="175.1" x2="479.6" y2="114.9" stroke="#b57f30" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowW)"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="210" cy="180" r="21"/>
  </g>
  <g stroke="#4169E1" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="60" cy="110" r="21"/>
    <circle cx="210" cy="40" r="21"/>
    <circle cx="500" cy="110" r="21"/>
  </g>
  <circle cx="350" cy="200" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="60" y="115">0</text>
    <text x="210" y="45">1</text>
    <text x="210" y="185">3</text>
    <text x="350" y="205">2</text>
    <text x="500" y="115">4</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="118" y="66" fill="#4169E1" font-weight="600">9</text>
    <text x="262" y="178" fill="#5c6b76">6</text>
    <text x="425" y="147" fill="#5c6b76">5</text>
    <text x="118" y="156" fill="#7a5a1e" font-weight="600">7</text>
  </g>
  <text x="355" y="62" fill="#4169E1" font-size="12" text-anchor="middle" font-weight="600">9 + 4 = 13, bottleneck 4</text>
  <text x="270" y="140" fill="#7a5a1e" font-weight="600" font-size="12" text-anchor="middle">7 + 8 = 15 &gt; k</text>
  <g font-size="11.5" fill="#5c6b76" text-anchor="middle">
    <text x="60" y="148">src</text>
    <text x="500" y="78">dest</text>
  </g>
  <text x="350" y="242" fill="#7a5a1e" font-size="12" text-anchor="middle" font-weight="600">offline</text>
  <text x="310" y="266" text-anchor="middle" fill="#1a2026" font-size="13.5">0 → 1 → 4 costs 9 + 4 = 13 ≤ k and bottlenecks at min(9, 4) = <tspan fill="#4169E1" font-weight="700">4</tspan>; node 2 is offline</text>
</svg>
