<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 6, edges = [[1,2,3],[2,3,2],[3,4,7],[4,5,1],[5,6,4]], queries = [[2,6],[2,5],[1,3,4,2],[2,5],[2,6]]; answers [17,13,8,12] (verified by simulation) -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="65" y1="96" x2="167" y2="96"/>
    <line x1="167" y1="96" x2="269" y2="96"/>
    <line x1="269" y1="96" x2="371" y2="96"/>
    <line x1="371" y1="96" x2="473" y2="96"/>
    <line x1="473" y1="96" x2="575" y2="96"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="65" cy="96" r="21"/>
    <circle cx="167" cy="96" r="21"/>
    <circle cx="269" cy="96" r="21"/>
    <circle cx="371" cy="96" r="21"/>
    <circle cx="473" cy="96" r="21"/>
    <circle cx="575" cy="96" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="65" y="101">1</text>
    <text x="167" y="101">2</text>
    <text x="269" y="101">3</text>
    <text x="371" y="101">4</text>
    <text x="473" y="101">5</text>
    <text x="575" y="101">6</text>
  </g>
  <text x="65" y="52" text-anchor="middle" fill="#5c6b76" font-size="11.5">root</text>
  <text x="116" y="80" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">3</text>
  <text x="218" y="80" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">2</text>
  <text x="320" y="80" text-anchor="middle" font-size="12" font-weight="600"><tspan fill="#5c6b76">7</tspan><tspan fill="#7a5a1e"> → 2</tspan></text>
  <text x="422" y="80" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">1</text>
  <text x="524" y="80" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">4</text>
  <g text-anchor="middle" font-size="12" font-weight="600">
    <text x="65" y="142" fill="#5c6b76">d = 0</text>
    <text x="167" y="142" fill="#5c6b76">d = 3</text>
    <text x="269" y="142" fill="#5c6b76">d = 5</text>
    <text x="371" y="142"><tspan fill="#5c6b76">d = 12</tspan><tspan fill="#7a5a1e"> → 7</tspan></text>
    <text x="473" y="142"><tspan fill="#5c6b76">d = 13</tspan><tspan fill="#7a5a1e"> → 8</tspan></text>
    <text x="575" y="142"><tspan fill="#5c6b76">d = 17</tspan><tspan fill="#7a5a1e"> → 12</tspan></text>
  </g>
  <text x="320" y="194" text-anchor="middle" fill="#1a2026" font-size="13.5">answers <tspan fill="#4169E1" font-weight="700">17, 13, 8, 12</tspan> — once edge (3, 4) shrinks from 7 to 2, everything at or below 4 drops by 5</text>
</svg>
