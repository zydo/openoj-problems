<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="220" y1="70" x2="110" y2="170"/>
    <line x1="220" y1="70" x2="220" y2="170"/>
    <line x1="220" y1="70" x2="330" y2="170"/>
  </g>
  <g font-weight="600" text-anchor="middle">
    <circle cx="220" cy="70" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="220" y="75" fill="#1a2026">3</text>
    <circle cx="110" cy="170" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="110" y="175" fill="#1a2026">0</text>
    <circle cx="220" cy="170" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="220" y="175" fill="#1a2026">1</text>
    <circle cx="330" cy="170" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="330" y="175" fill="#1a2026">2</text>
  </g>
  <text x="220" y="228" text-anchor="middle" fill="#1a2026" font-size="12.5">the hub scores 3; each spoke pays 1 to the hub and 2 to its siblings</text>
</svg>
