<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g stroke="#42525e" stroke-width="1.5">
    <line x1="200" y1="45" x2="200" y2="115"/>
    <line x1="200" y1="115" x2="110" y2="185"/>
    <line x1="230" y1="255" x2="300" y2="185"/>
    <line x1="300" y1="185" x2="380" y2="255"/>
    <line x1="380" y1="255" x2="380" y2="325"/>
  </g>
  <line x1="200" y1="115" x2="300" y2="185" stroke="#4169E1" stroke-width="2.4"/>
  <g font-weight="600" text-anchor="middle">
    <circle cx="200" cy="45" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
    <text x="200" y="50" fill="#1a2026">0</text>
    <circle cx="200" cy="115" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
    <text x="200" y="120" fill="#1a2026">1</text>
    <circle cx="110" cy="185" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
    <text x="110" y="190" fill="#1a2026">2</text>
    <circle cx="300" cy="185" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
    <text x="300" y="190" fill="#1a2026">3</text>
    <circle cx="230" cy="255" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
    <text x="230" y="260" fill="#1a2026">4</text>
    <circle cx="380" cy="255" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
    <text x="380" y="260" fill="#1a2026">5</text>
    <circle cx="380" cy="325" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
    <text x="380" y="330" fill="#1a2026">6</text>
  </g>
  <g fill="#4169E1" font-size="11.5" text-anchor="middle">
    <text x="200" y="21">total 15</text>
    <text x="140" y="103">total 10</text>
    <text x="110" y="161">total 15</text>
    <text x="360" y="172">total 9</text>
    <text x="230" y="231">total 14</text>
    <text x="440" y="242">total 12</text>
    <text x="440" y="312">total 17</text>
  </g>
  <g fill="#5c6b76" font-size="11">
    <text x="222" y="72">below 7</text>
    <text x="248" y="140">below 6</text>
    <text x="132" y="214">below 1</text>
    <text x="322" y="214">below 4</text>
    <text x="252" y="284">below 1</text>
    <text x="402" y="284">below 2</text>
    <text x="402" y="354">below 1</text>
  </g>
  <text x="40" y="380" fill="#5c6b76" font-size="12">Rooted at 0, node 3 carries 4 nodes and node 1 already holds 10. Crossing the</text>
  <text x="40" y="398" fill="#5c6b76" font-size="12">thick link downward, those 4 nodes each lose a step and the other 3 each gain</text>
  <text x="40" y="416" fill="#5c6b76" font-size="12">one: 10 &#8722; 4 + 3 = 9, which is node 3's total.</text>
</svg>
