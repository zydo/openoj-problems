<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g stroke="#1a2026" stroke-width="1.6">
    <line x1="60" y1="60" x2="140" y2="60"/>
    <line x1="140" y1="60" x2="220" y2="60"/>
    <line x1="220" y1="60" x2="300" y2="60"/>
    <line x1="300" y1="60" x2="380" y2="60"/>
  </g>
  <g font-weight="600" text-anchor="middle">
    <circle cx="60" cy="60" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="60" y="65" fill="#1a2026">0</text>
    <circle cx="140" cy="60" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="140" y="65" fill="#1a2026">1</text>
    <circle cx="220" cy="60" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="220" y="65" fill="#1a2026">2</text>
    <circle cx="300" cy="60" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="300" y="65" fill="#1a2026">3</text>
    <circle cx="380" cy="60" r="19" fill="#ffffff" stroke="#1a2026" stroke-width="1.6"/>
    <text x="380" y="65" fill="#1a2026">4</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12.5">
    <text x="60" y="104">10</text>
    <text x="140" y="104">7</text>
    <text x="220" y="104">6</text>
    <text x="300" y="104">7</text>
    <text x="380" y="104">10</text>
  </g>
  <text x="220" y="150" text-anchor="middle" fill="#1a2026" font-size="12.5">a row of five: the middle node is cheapest, the two ends dearest</text>
</svg>
