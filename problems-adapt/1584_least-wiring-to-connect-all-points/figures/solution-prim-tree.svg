<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="780" height="360" fill="#ffffff"/>
  <!-- points: [(1, 1), (2, 4), (5, 3), (7, 6), (8, 1)]; x = 70 + 60*u, y = 290 - 30*v -->
  <!-- MST runs in Prim order: [(0, 1, 4), (1, 2, 4), (2, 3, 5), (2, 4, 5)] -->
  <g stroke="#4169E1" stroke-width="2.5">
    <line x1="130" y1="260" x2="190" y2="170"/>
    <line x1="190" y1="170" x2="370" y2="200"/>
    <line x1="370" y1="200" x2="490" y2="110"/>
    <line x1="370" y1="200" x2="550" y2="260"/>
  </g>
  <!-- run length labels -->
  <g fill="#4169E1" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="160" y="205">4</text>
    <text x="280" y="175">4</text>
    <text x="430" y="145">5</text>
    <text x="460" y="220">5</text>
  </g>
  <!-- order badges on picked runs -->
  <g font-size="11" text-anchor="middle">
    <circle cx="150" cy="239" r="9" fill="#ffffff" stroke="#4169E1" stroke-width="1.5"/>
    <text x="150" y="243" fill="#4169E1">1</text>
    <circle cx="251" cy="190" r="9" fill="#ffffff" stroke="#4169E1" stroke-width="1.5"/>
    <text x="251" y="194" fill="#4169E1">2</text>
    <circle cx="411" cy="179" r="9" fill="#ffffff" stroke="#4169E1" stroke-width="1.5"/>
    <text x="411" y="183" fill="#4169E1">3</text>
    <circle cx="431" cy="230" r="9" fill="#ffffff" stroke="#4169E1" stroke-width="1.5"/>
    <text x="431" y="234" fill="#4169E1">4</text>
  </g>
  <!-- points -->
  <g fill="#1a2026">
    <circle cx="130" cy="260" r="7"/> <circle cx="190" cy="170" r="7"/> <circle cx="370" cy="200" r="7"/> <circle cx="490" cy="110" r="7"/> <circle cx="550" cy="260" r="7"/>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="130" y="286">(1,1)</text> <text x="190" y="196">(2,4)</text> <text x="370" y="226">(5,3)</text> <text x="490" y="136">(7,6)</text> <text x="550" y="286">(8,1)</text>
  </g>
  <!-- narration -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="600" y="110">Prim keeps one partial</text>
    <text x="600" y="128">tree and banks, each</text>
    <text x="600" y="146">round, the cheapest</text>
    <text x="600" y="164">run leaving it — the</text>
    <text x="600" y="182">badges 1..4 give the</text>
    <text x="600" y="200">order for this input.</text>
  </g>
  <text x="60" y="345" fill="#1a2026" font-size="13">The four tree runs cost 4 + 4 + 5 + 5 = <tspan fill="#4169E1" font-weight="600">18</tspan>; every point keeps exactly one path to every other.</text>
</svg>
