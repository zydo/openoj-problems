<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 168" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- edges = [[0,1],[1,2],[2,3],[3,4]], nums = [3,-6,2,-8,5], k = 2; flip {1,4} -> nums = [3, 6, -2, 8, 5], sum 20 (verified by brute force) -->
  <line x1="91" y1="64" x2="509" y2="64" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="70" cy="64" r="21"/>
    <circle cx="290" cy="64" r="21"/>
    <circle cx="400" cy="64" r="21"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="180" cy="64" r="21"/>
    <circle cx="510" cy="64" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="70" y="69">0</text>
    <text x="180" y="69">1</text>
    <text x="290" y="69">2</text>
    <text x="400" y="69">3</text>
    <text x="510" y="69">4</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="70" y="106" fill="#5c6b76">3</text>
    <text x="180" y="106" fill="#4169E1" font-weight="600">-6 → 6</text>
    <text x="290" y="106" fill="#4169E1" font-weight="600">2 → -2</text>
    <text x="400" y="106" fill="#4169E1" font-weight="600">-8 → 8</text>
    <text x="510" y="106" fill="#5c6b76">5 (flipped twice)</text>
  </g>
  <text x="290" y="150" text-anchor="middle" fill="#1a2026" font-size="13.5">flip nodes 1 and 4 (filled); node 4 is flipped twice and lands back on 5: nums becomes [3, 6, -2, 8, 5], sum <tspan fill="#4169E1" font-weight="700">20</tspan></text>
</svg>
