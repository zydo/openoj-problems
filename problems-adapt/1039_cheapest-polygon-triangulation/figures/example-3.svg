<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- values = [2,6,2,9,2,8] clockwise from the top; diagonals v0-v2, v0-v4, v2-v4 -->
  <g stroke="#1a2026" stroke-width="1.6" fill="none">
    <path d="M 200 30 L 269.3 70 L 269.3 150 L 200 190 L 130.7 150 L 130.7 70 z"/>
  </g>
  <g stroke="#4169E1" stroke-width="2.4">
    <line x1="200" y1="30" x2="269.3" y2="150"/>
    <line x1="200" y1="30" x2="130.7" y2="150"/>
    <line x1="269.3" y1="150" x2="130.7" y2="150"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="200" cy="30" r="16"/>
    <circle cx="269.3" cy="70" r="16"/>
    <circle cx="269.3" cy="150" r="16"/>
    <circle cx="200" cy="190" r="16"/>
    <circle cx="130.7" cy="150" r="16"/>
    <circle cx="130.7" cy="70" r="16"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="200" y="35">2</text>
    <text x="269.3" y="75">6</text>
    <text x="269.3" y="155">2</text>
    <text x="200" y="195">9</text>
    <text x="130.7" y="155">2</text>
    <text x="130.7" y="75">8</text>
  </g>
  <g fill="#5c6b76" font-size="12" text-anchor="middle">
    <text x="246" y="86">24</text>
    <text x="200" y="114">8</text>
    <text x="200" y="166">36</text>
    <text x="154" y="86">32</text>
  </g>
  <text x="200" y="238" text-anchor="middle" fill="#5c6b76" font-size="12.5">each triangle's product is marked: 24 + 8 + 36 + 32 = 100</text>
</svg>
