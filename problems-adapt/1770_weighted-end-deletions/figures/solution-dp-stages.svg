<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="660" height="320" fill="#ffffff"/>
  <!-- nums = [-9,-8,1], weights = [4,2,-3]; triangular dp over (i, l) -->
  <text x="40" y="40" fill="#5c6b76" font-size="12.5">nums = [−9, −8, 1] · weights = [4, 2, −3]</text>
  <!-- stage i=3 base row -->
  <text x="40" y="96" fill="#5c6b76" font-size="12.5">i = 3 (base)</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#ffffff">
    <rect x="200" y="76" width="60" height="34"/>
  </g>
  <text x="230" y="98" text-anchor="middle" font-weight="600">0</text>
  <!-- stage i=2 -->
  <text x="40" y="150" fill="#5c6b76" font-size="12.5">i = 2 · weight −3</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4f6">
    <rect x="170" y="130" width="60" height="34"/><rect x="230" y="130" width="60" height="34"/><rect x="290" y="130" width="60" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="200" y="152">27</text><text x="260" y="152">24</text><text x="320" y="152">−3</text>
  </g>
  <!-- stage i=1 -->
  <text x="40" y="204" fill="#5c6b76" font-size="12.5">i = 1 · weight 2</text>
  <g stroke="#42525e" stroke-width="1.5" fill="#dbe4f6">
    <rect x="140" y="184" width="60" height="34"/><rect x="200" y="184" width="60" height="34"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="170" y="206">11</text><text x="230" y="206">26</text>
  </g>
  <!-- stage i=0 -->
  <text x="40" y="258" fill="#5c6b76" font-size="12.5">i = 0 · weight 4</text>
  <rect x="110" y="238" width="60" height="34" fill="#4169E1" stroke="#42525e" stroke-width="1.5"/>
  <text x="140" y="260" text-anchor="middle" font-weight="600" fill="#ffffff">15</text>
  <!-- winning path: dp[0][0] <- dp[1][0] <- dp[2][0] <- 0 -->
  <g stroke="#1a2026" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <line x1="140" y1="236" x2="170" y2="220"/>
    <line x1="170" y1="182" x2="200" y2="166"/>
    <line x1="200" y1="128" x2="230" y2="112"/>
  </g>
  <!-- l axis -->
  <g text-anchor="middle" fill="#5c6b76" font-size="11.5">
    <text x="230" y="66">l = 0</text>
    <text x="200" y="120">l = 0</text><text x="260" y="120">l = 1</text><text x="320" y="120">l = 2</text>
    <text x="170" y="174">l = 0</text><text x="230" y="174">l = 1</text>
    <text x="140" y="228">l = 0</text>
  </g>
  <g font-size="12.5" fill="#5c6b76">
    <text x="380" y="96">Rows are stages of the rolling array,</text>
    <text x="380" y="112">each holding only its reachable</text>
    <text x="380" y="128">l values (l &gt; i stays −∞).</text>
    <text x="380" y="160">dp[1][0] = max(24 + 2·(−9),</text>
    <text x="380" y="176">              27 + 2·(−8)) = 11 — take back</text>
    <text x="380" y="192">dp[1][1] = max(−3 + 2·(−8),</text>
    <text x="380" y="208">              24 + 2·1) = 26 — take back</text>
    <text x="380" y="240">dp[0][0] = max(26 + 4·(−9), 11 + 4·1) = 15</text>
  </g>
  <text x="380" y="270" fill="#1a2026" font-size="13">The dashed path reads as: delete the</text>
  <text x="380" y="286" fill="#1a2026" font-size="13">back end three times, 4 − 16 + 27 = <tspan fill="#4169E1" font-weight="600">15</tspan>.</text>
</svg>
