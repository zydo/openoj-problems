<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- squares = [[0,0,4],[2,2,2]]; overlaps count twice; below(7/3) = 28/3 + 2/3 = 10 = above(7/3) (verified exactly) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <rect x="70" y="70" width="220" height="220" fill="#f6ecd9" stroke="#b57f30" stroke-width="1.6"/>
  <rect x="180" y="70" width="110" height="110" fill="#e6ecfb" fill-opacity="0.72" stroke="#4169E1" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.6" fill="none">
    <line x1="56" y1="290" x2="390" y2="290" marker-end="url(#arrow)"/>
    <line x1="70" y1="304" x2="70" y2="50" marker-end="url(#arrow)"/>
    <line x1="125" y1="290" x2="125" y2="295"/>
    <line x1="180" y1="290" x2="180" y2="295"/>
    <line x1="235" y1="290" x2="235" y2="295"/>
    <line x1="290" y1="290" x2="290" y2="295"/>
    <line x1="65" y1="235" x2="70" y2="235"/>
    <line x1="65" y1="180" x2="70" y2="180"/>
    <line x1="65" y1="125" x2="70" y2="125"/>
    <line x1="65" y1="70" x2="70" y2="70"/>
  </g>
  <g fill="#5c6b76" font-size="11" text-anchor="middle">
    <text x="125" y="308">1</text>
    <text x="180" y="308">2</text>
    <text x="235" y="308">3</text>
    <text x="290" y="308">4</text>
    <text x="58" y="239">1</text>
    <text x="58" y="184">2</text>
    <text x="58" y="129">3</text>
    <text x="58" y="74">4</text>
    <text x="58" y="308">0</text>
  </g>
  <line x1="54" y1="162" x2="392" y2="162" stroke="#42525e" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="398" y="166" fill="#42525e" font-size="12.5" font-weight="600">y = 7/3 ≈ 2.33333</text>
  <text x="235" y="120" text-anchor="middle" fill="#7a5a1e" font-size="12" font-weight="600">counted twice</text>
  <g fill="#5c6b76" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="125" y="230">below = 10</text>
    <text x="125" y="140">above = 10</text>
  </g>
  <text x="320" y="328" text-anchor="middle" fill="#1a2026" font-size="13.5">below: 7/3 · 4 + 1/3 · 2 = <tspan fill="#4169E1" font-weight="700">10</tspan>; above: 5/3 · 4 + 5/3 · 2 = <tspan fill="#4169E1" font-weight="700">10</tspan> — the answer is <tspan fill="#4169E1" font-weight="700">y = 7/3</tspan></text>
</svg>
