<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 240" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- edges = [2,-1,3,1]: 0->2, 2->3, 3->1 -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="111" y1="50" x2="209" y2="50" marker-end="url(#arrowM)"/>
    <line x1="230" y1="71" x2="230" y2="159" marker-end="url(#arrowM)"/>
    <line x1="251" y1="180" x2="359" y2="180" marker-end="url(#arrowM)"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="90" cy="50" r="21"/>
    <circle cx="230" cy="50" r="21"/>
    <circle cx="230" cy="180" r="21"/>
    <circle cx="380" cy="180" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="90" y="55">0</text>
    <text x="230" y="55">2</text>
    <text x="230" y="185">3</text>
    <text x="380" y="185">1</text>
  </g>
  <text x="235" y="226" text-anchor="middle" fill="#1a2026" font-size="13.5">every walk eventually stops; no cycle → <tspan fill="#4169E1" font-weight="700">-1</tspan></text>
</svg>
