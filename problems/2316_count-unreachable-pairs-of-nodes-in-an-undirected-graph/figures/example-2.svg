<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 262" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 7, edges = [[0,2],[0,5],[2,4],[1,6],[5,4]] -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="170" y1="36" x2="90" y2="126"/>
    <line x1="90" y1="126" x2="170" y2="216"/>
    <line x1="170" y1="216" x2="250" y2="126"/>
    <line x1="250" y1="126" x2="170" y2="36"/>
    <line x1="350" y1="90" x2="450" y2="90"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#e6ecfb">
    <circle cx="170" cy="36" r="21"/>
    <circle cx="90" cy="126" r="21"/>
    <circle cx="170" cy="216" r="21"/>
    <circle cx="250" cy="126" r="21"/>
    <circle cx="350" cy="90" r="21"/>
    <circle cx="450" cy="90" r="21"/>
  </g>
  <circle cx="400" cy="216" r="21" fill="#ffffff" stroke="#42525e" stroke-width="1.6"/>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="170" y="41">0</text>
    <text x="90" y="131">2</text>
    <text x="170" y="221">4</text>
    <text x="250" y="131">5</text>
    <text x="350" y="95">1</text>
    <text x="450" y="95">6</text>
    <text x="400" y="221">3</text>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="170" y="14" text-anchor="middle">component of size 4</text>
    <text x="400" y="60" text-anchor="middle">size 2</text>
    <text x="440" y="240" text-anchor="middle">size 1</text>
  </g>
  <text x="260" y="252" text-anchor="middle" fill="#1a2026" font-size="13.5">21 − 6 − 1 = <tspan fill="#4169E1" font-weight="700">14</tspan> unreachable pairs</text>
</svg>
