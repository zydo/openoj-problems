<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- n = 4, edges = [[0,1],[1,2],[2,3],[3,0]] -->
  <g stroke="#42525e" stroke-width="1.6">
    <line x1="200" y1="40" x2="320" y2="150"/>
    <line x1="320" y1="150" x2="200" y2="260"/>
    <line x1="200" y1="260" x2="80" y2="150"/>
    <line x1="80" y1="150" x2="200" y2="40"/>
  </g>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="200" cy="40" r="21"/>
    <circle cx="320" cy="150" r="21"/>
    <circle cx="200" cy="260" r="21"/>
    <circle cx="80" cy="150" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="200" y="45">0</text>
    <text x="320" y="155">1</text>
    <text x="200" y="265">2</text>
    <text x="80" y="155">3</text>
  </g>
  <text x="225" y="292" text-anchor="middle" fill="#1a2026" font-size="13.5">the cycle joins everything into one component → <tspan fill="#4169E1" font-weight="700">0</tspan> unreachable pairs</text>
</svg>
