<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
  <g fill="#5c6b76" font-size="12">
    <text x="30" y="34">A middle grows outward while the two characters entering</text>
    <text x="30" y="52">the window still agree, and every step that agrees is one</text>
    <text x="30" y="70">more palindrome. The first disagreement ends that middle.</text>
  </g>
  <path d="M 158 106 L 158 140" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <text x="158" y="98" text-anchor="middle" fill="#4169E1">seam between 1 and 2: &quot;oo&quot;</text>
  <g fill="#ffffff" stroke="#1a2026">
    <rect x="50" y="150" width="54" height="46"/>
    <rect x="104" y="150" width="54" height="46"/>
    <rect x="158" y="150" width="54" height="46"/>
    <rect x="212" y="150" width="54" height="46"/>
  </g>
  <g text-anchor="middle" fill="#98a4ad" font-size="10">
    <text x="77" y="146">0</text>
    <text x="131" y="146">1</text>
    <text x="185" y="146">2</text>
    <text x="239" y="146">3</text>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="77" y="178">n</text>
    <text x="131" y="178">o</text>
    <text x="185" y="178">o</text>
    <text x="239" y="178">n</text>
  </g>
  <g fill="#5c6b76" font-size="12">
    <text x="286" y="168">each of the four odd</text>
    <text x="286" y="184">middles stops after</text>
    <text x="286" y="200">its own single letter</text>
  </g>
  <path d="M 56 202 C 158 250, 158 250, 260 202" fill="none" stroke="#4169E1" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <text x="158" y="268" text-anchor="middle" fill="#4169E1">one more step reaches &quot;noon&quot;</text>
</svg>
