<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 278" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
  </defs>
  <!-- n = 3, precedence = [[1,3],[3,2],[2,1]]: the arrows close a ring, so nothing is ever eligible -->
  <g stroke="#42525e" stroke-width="1.8" fill="none">
    <line x1="251" y1="50" x2="129" y2="50" marker-end="url(#ra)"/>
    <line x1="202.6" y1="159.6" x2="260.1" y2="66.2" marker-end="url(#ra)"/>
    <line x1="122.6" y1="70.4" x2="180" y2="163.8" marker-end="url(#ra)"/>
  </g>
  <g fill="#ffffff" stroke="#1a2026" stroke-width="1.6">
    <circle cx="110" cy="50" r="19"/>
    <circle cx="270" cy="50" r="19"/>
    <circle cx="190" cy="180" r="19"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="110" y="55">1</text>
    <text x="270" y="55">2</text>
    <text x="190" y="185">3</text>
  </g>
  <text x="190" y="228" text-anchor="middle" fill="#5c6b76" font-size="12.5">every course points at the</text>
  <text x="190" y="247" text-anchor="middle" fill="#5c6b76" font-size="12.5">next one around the ring, so</text>
  <text x="190" y="266" text-anchor="middle" fill="#5c6b76" font-size="12.5">none of them can open: -1</text>
</svg>
