<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42525e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169E1"/>
    </marker>
  </defs>
<line x1="300" y1="44" x2="180" y2="124" stroke="#42525e" stroke-width="1.5"/>
  <line x1="300" y1="44" x2="420" y2="124" stroke="#42525e" stroke-width="1.5"/>
  <line x1="180" y1="124" x2="100" y2="204" stroke="#42525e" stroke-width="1.5"/>
  <line x1="180" y1="124" x2="260" y2="204" stroke="#42525e" stroke-width="1.5"/>
  <line x1="420" y1="124" x2="500" y2="204" stroke="#42525e" stroke-width="1.5"/>
  <circle cx="300" cy="44" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="300" y="49" text-anchor="middle" font-weight="600">20</text>
  <text x="300" y="78" text-anchor="middle" fill="#4169E1" font-size="11">(&#8722;&#8734;, +&#8734;)</text>
  <circle cx="180" cy="124" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="180" y="129" text-anchor="middle" font-weight="600">9</text>
  <text x="180" y="158" text-anchor="middle" fill="#4169E1" font-size="11">(&#8722;&#8734;, 19)</text>
  <circle cx="100" cy="204" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="100" y="209" text-anchor="middle" font-weight="600">4</text>
  <text x="100" y="238" text-anchor="middle" fill="#4169E1" font-size="11">(&#8722;&#8734;, 8)</text>
  <circle cx="260" cy="204" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="260" y="209" text-anchor="middle" font-weight="600">15</text>
  <text x="260" y="238" text-anchor="middle" fill="#4169E1" font-size="11">(10, 19)</text>
  <circle cx="420" cy="124" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="420" y="129" text-anchor="middle" font-weight="600">26</text>
  <text x="420" y="158" text-anchor="middle" fill="#4169E1" font-size="11">(21, +&#8734;)</text>
  <circle cx="500" cy="204" r="17" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/><text x="500" y="209" text-anchor="middle" font-weight="600">33</text>
  <text x="500" y="238" text-anchor="middle" fill="#4169E1" font-size="11">(27, +&#8734;)</text>
  <text x="40" y="286" fill="#5c6b76" font-size="12">preorder = [20, 9, 4, 15, 26, 33]: a value is taken only when the current range</text>
  <text x="40" y="304" fill="#5c6b76" font-size="12">admits it; going left narrows the range to (low, v&#8722;1) and going right to (v+1, high).</text>
  <text x="40" y="322" fill="#5c6b76" font-size="12">A value the range rejects is left for whichever ancestor can still accept it.</text>
</svg>
