    <text x="92" y="120">7</text><text x="162" y="120" font-weight="700">12</text><text x="232" y="120">26</text><text x="302" y="120">33</text><text x="372" y="120">41</text>
    <text x="92" y="170">10</text><text x="162" y="170">17</text><text x="232" y="170">30</text><text x="302" y="170">38</text><text x="372" y="170">47</text>
    <text x="92" y="220">16</text><text x="162" y="220">23</text><text x="232" y="220">34</text><text x="302" y="220">42</text><text x="372" y="220">52</text>
