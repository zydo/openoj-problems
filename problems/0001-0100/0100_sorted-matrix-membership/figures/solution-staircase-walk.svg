    <rect x="270" y="90" width="64" height="44"/><rect x="270" y="140" width="64" height="44"/><rect x="270" y="190" width="64" height="44"/><rect x="270" y="240" width="64" height="44"/>
    <rect x="200" y="90" width="64" height="44"/><rect x="200" y="140" width="64" height="44"/><rect x="200" y="190" width="64" height="44"/><rect x="200" y="240" width="64" height="44"/>
