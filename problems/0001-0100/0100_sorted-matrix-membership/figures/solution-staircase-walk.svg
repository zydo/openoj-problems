  <text x="60" y="312" fill="#5c6b76" font-size="12.5">start top-right, target 12: 35 &#8594; 29 &#8594; 21 each drop a</text>
  <text x="60" y="330" fill="#5c6b76" font-size="12.5">column, 8 &#60; 12 drops the row shaded cells are already</text>
  <text x="60" y="348" fill="#5c6b76" font-size="12.5">eliminated &#183; the walk lands on 12 in five steps</text>
