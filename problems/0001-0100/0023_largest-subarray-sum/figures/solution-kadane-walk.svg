<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 278" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="580" height="278" fill="#ffffff"/>
  <text x="20" y="24" fill="#1a2026" font-weight="600">nums = [-3,5,-6,4,-1,3,-2,1,-4] - best subarray sum ending at each index (current)</text>
  <!-- nums row -->
  <text x="20" y="92" fill="#5b6470" font-size="11.5">nums</text>
  <g stroke="#1a2026" stroke-width="1.4" fill="#ffffff">
    <rect x="70" y="72" width="52" height="30"/><rect x="122" y="72" width="52" height="30"/><rect x="174" y="72" width="52" height="30"/><rect x="226" y="72" width="52" height="30"/><rect x="278" y="72" width="52" height="30"/><rect x="330" y="72" width="52" height="30"/><rect x="382" y="72" width="52" height="30"/><rect x="434" y="72" width="52" height="30"/><rect x="486" y="72" width="52" height="30"/>
  </g>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="96" y="92">-3</text><text x="148" y="92">5</text><text x="200" y="92">-6</text><text x="252" y="92">4</text><text x="304" y="92">-1</text><text x="356" y="92">3</text><text x="408" y="92">-2</text><text x="460" y="92">1</text><text x="512" y="92">-4</text>
  </g>
  <!-- current row -->
  <text x="20" y="152" fill="#5b6470" font-size="11.5">current</text>
  <g stroke="#1a2026" stroke-width="1.4" fill="#e9eefb">
    <rect x="70" y="132" width="52" height="30"/><rect x="122" y="132" width="52" height="30"/><rect x="174" y="132" width="52" height="30"/><rect x="226" y="132" width="52" height="30"/><rect x="278" y="132" width="52" height="30"/><rect x="330" y="132" width="52" height="30"/><rect x="382" y="132" width="52" height="30"/><rect x="434" y="132" width="52" height="30"/><rect x="486" y="132" width="52" height="30"/>
  </g>
  <rect x="330" y="132" width="52" height="30" fill="none" stroke="#4169E1" stroke-width="2.6"/>
  <g fill="#1a2026" text-anchor="middle" font-weight="600">
    <text x="96" y="152">-3</text><text x="148" y="152">5</text><text x="200" y="152">-1</text><text x="252" y="152">4</text><text x="304" y="152">3</text><text x="356" y="152" fill="#4169E1">6</text><text x="408" y="152">4</text><text x="460" y="152">5</text><text x="512" y="152">1</text>
  </g>
  <!-- restart separators -->
  <line x1="122" y1="66" x2="122" y2="168" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="226" y1="66" x2="226" y2="168" stroke="#4169E1" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="130" y="58" fill="#4169E1" font-size="10.5">restart: prefix sum -3 &lt; 0, dropped</text>
  <text x="234" y="44" fill="#4169E1" font-size="10.5">restart: prefix sum -1 &lt; 0, dropped</text>
  <!-- best bracket under cells 3..5 -->
  <path d="M 226 178 L 226 188 L 382 188 L 382 178" fill="none" stroke="#4169E1" stroke-width="1.6"/>
  <text x="304" y="208" fill="#4169E1" text-anchor="middle" font-size="11.5" font-weight="600">best = 6, the subarray [4, -1, 3]</text>
  <text x="20" y="230" fill="#5b6470" font-size="11.5">Everywhere else current = previous current + value; a negative running sum</text>
  <text x="20" y="246" fill="#5b6470" font-size="11.5">can only drag down what follows, so it is replaced by a fresh start.</text>
  <text x="20" y="262" fill="#5b6470" font-size="11.5">The answer is the largest current ever seen, not the final one.</text>
</svg>
