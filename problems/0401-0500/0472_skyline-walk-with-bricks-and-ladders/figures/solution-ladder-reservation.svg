<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="680" height="330" fill="#ffffff"/>
  <!-- bars: heights [2, 6, 4, 9, 7, 13, 11]; x = 66 + i*86, w 56, baseline 268, scale 12px/unit -->
  <line x1="40" y1="268" x2="660" y2="268" stroke="#42525e" stroke-width="1.6"/>
  <g fill="#dbe4f6" stroke="#42525e" stroke-width="1.5">
    <rect x="66" y="244" width="56" height="24"/>
    <rect x="152" y="196" width="56" height="72"/>
    <rect x="238" y="220" width="56" height="48"/>
    <rect x="324" y="160" width="56" height="108"/>
    <rect x="410" y="184" width="56" height="84"/>
  </g>
  <g fill="#ffffff" stroke="#42525e" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="496" y="112" width="56" height="156"/>
    <rect x="582" y="136" width="56" height="132"/>
  </g>
  <g text-anchor="middle" fill="#1a2026" font-weight="600">
    <text x="94" y="272">2</text> <text x="180" y="224">6</text> <text x="266" y="248">4</text> <text x="352" y="188">9</text> <text x="438" y="212">7</text> <text x="524" y="140">13</text> <text x="610" y="164">11</text>
  </g>
  <g text-anchor="middle" fill="#5c6b76" font-size="12">
    <text x="94" y="288">0</text> <text x="180" y="288">1</text> <text x="266" y="288">2</text> <text x="352" y="288">3</text> <text x="438" y="288">4</text> <text x="524" y="288">5</text> <text x="610" y="288">6</text>
  </g>
  <path d="M 120 234 Q 137 170 154 186" fill="none" stroke="#5c6b76" stroke-width="2"/>
  <text x="137" y="162" text-anchor="middle" fill="#5c6b76" font-weight="600" font-size="12.5">+4 · bricks</text>
  <path d="M 292 210 Q 309 134 326 150" fill="none" stroke="#4169E1" stroke-width="2"/>
  <text x="309" y="126" text-anchor="middle" fill="#4169E1" font-weight="600" font-size="12.5">+5 · ladder</text>
  <path d="M 464 174 Q 481 86 498 102" fill="none" stroke="#42525e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="481" y="78" text-anchor="middle" fill="#42525e" font-weight="600" font-size="12.5">+6 · only 3 bricks left</text>
  <line x1="40" y1="310" x2="466" y2="310" stroke="#4169E1" stroke-width="2.5"/>
  <text x="40" y="326" fill="#4169E1" font-size="12.5" font-weight="600">reachable with 7 bricks, 1 ladder</text>
  <text x="480" y="326" fill="#5c6b76" font-size="12.5">stops at index 4</text>
  <g font-size="12.5" fill="#5c6b76">
    <text x="40" y="36">The heap keeps the 1 largest climb on the ladder;</text>
    <text x="40" y="54">the evicted +4 costs 7 − 4 = 3 bricks. The next +6</text>
    <text x="40" y="72">would evict again — rooftop 4 is the furthest.</text>
  </g>
</svg>
