<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 693 360" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <rect width="693" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b76"/>
    </marker>
  </defs>
  <!-- circle of 5 friends, center (300,180) r 118 -->
  <circle cx="300" cy="180" r="118" fill="none" stroke="#dbe4f6" stroke-width="2"/>
  <!-- counting arrows: 1->3, 4->1, 2->5, 2->2 (wraps the whole pair) -->
  <g stroke="#5c6b76" stroke-width="1.8" fill="none">
    <path d="M 306 81 Q 357 156 361 251" marker-end="url(#arrow)"/>
    <path d="M 237 256 Q 240 166 292 87" marker-end="url(#arrow)"/>
    <path d="M 392 144 Q 305 119 214 144" marker-end="url(#arrow)"/>
    <path d="M 432 152 Q 456 129 422 123" marker-end="url(#arrow)"/>
  </g>
  <!-- nodes: winner accent; eliminated struck through -->
  <circle cx="300" cy="62" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="300" y="67" text-anchor="middle" font-weight="600" fill="#1a2026">1</text>
  <circle cx="412" cy="144" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="412" y="149" text-anchor="middle" font-weight="600" fill="#1a2026">2</text>
  <circle cx="369" cy="275" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="369" y="280" text-anchor="middle" font-weight="600" fill="#1a2026">3</text>
  <circle cx="231" cy="275" r="20" fill="#4169E1" stroke="#42525e" stroke-width="1.5"/>
  <text x="231" y="280" text-anchor="middle" font-weight="600" fill="#ffffff">4</text>
  <circle cx="188" cy="144" r="20" fill="#ffffff" stroke="#42525e" stroke-width="1.5"/>
  <text x="188" y="149" text-anchor="middle" font-weight="600" fill="#1a2026">5</text>
  <!-- strikethrough on eliminated -->
  <g stroke="#5c6b76" stroke-width="1.8">
    <line x1="353" y1="260" x2="385" y2="290"/>
    <line x1="284" y1="47" x2="316" y2="77"/>
    <line x1="172" y1="129" x2="204" y2="159"/>
    <line x1="396" y1="129" x2="428" y2="159"/>
  </g>
  <!-- elimination order badges -->
  <g font-size="11.5" fill="#5c6b76">
    <text x="395" y="311" text-anchor="middle">leaves 1st</text>
    <text x="300" y="18" text-anchor="middle">leaves 2nd</text>
    <text x="146" y="130" text-anchor="middle">leaves 3rd</text>
    <text x="454" y="130" text-anchor="middle">leaves 4th</text>
    <text x="231" y="316" text-anchor="middle" fill="#4169E1" font-weight="600">winner</text>
  </g>
  <!-- narration -->
  <g font-size="12.5" fill="#5c6b76">
    <text x="470" y="200">k = 3: each count of three</text>
    <text x="470" y="216">clockwise lands on</text>
    <text x="470" y="232">(idx + k − 1) % len,</text>
    <text x="470" y="248">so 3, 1, 5, then 2 leave.</text>
  </g>
  <text x="40" y="340" fill="#1a2026" font-size="13">After a pop, the same idx already points at the next count’s start — friend <tspan fill="#4169E1" font-weight="600">4</tspan> is never counted out and wins.</text>
</svg>
