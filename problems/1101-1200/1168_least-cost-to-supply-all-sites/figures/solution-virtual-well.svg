<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 348" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <line x1="120" y1="50" x2="360" y2="50" stroke="#4169E1" stroke-width="2.6" />
  <line x1="240" y1="140" x2="360" y2="50" stroke="#4169E1" stroke-width="2.6" />
  <line x1="240" y1="140" x2="240" y2="230" stroke="#4169E1" stroke-width="2.6" />
  <line x1="120" y1="50" x2="240" y2="140" stroke="#42525e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="120" y1="50" x2="240" y2="230" stroke="#42525e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="240.0" y="38.0" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">3</text>
  <text x="316.0" y="99.0" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">1</text>
  <text x="256.0" y="185.0" text-anchor="middle" fill="#4169E1" font-size="12" font-weight="600">2</text>
  <text x="180.0" y="95.0" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">4</text>
  <text x="174.0" y="140.0" text-anchor="middle" fill="#5c6b76" font-size="12" font-weight="600">5</text>
  <circle cx="120" cy="50" r="18" fill="#e8edf8" stroke="#1a2026" stroke-width="1.5"/>
  <text x="120" y="55" text-anchor="middle" font-weight="600">0</text>
  <circle cx="240" cy="140" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="240" y="145" text-anchor="middle" font-weight="600">1</text>
  <circle cx="360" cy="50" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="360" y="55" text-anchor="middle" font-weight="600">2</text>
  <circle cx="240" cy="230" r="18" fill="#ffffff" stroke="#1a2026" stroke-width="1.5"/>
  <text x="240" y="235" text-anchor="middle" font-weight="600">3</text>
  <text x="120" y="22" text-anchor="middle" fill="#4169E1" font-size="12">virtual source</text>
  <text x="40" y="296" fill="#5c6b76" font-size="12">sources = [4, 3, 5], links = [[1,2,1],[1,3,2]]: node 0 carries the source</text>
  <text x="40" y="314" fill="#5c6b76" font-size="12">costs, and the MST takes the two links plus the cheapest source</text>
  <text x="40" y="332" fill="#5c6b76" font-size="12">edge, totalling 6.</text>
