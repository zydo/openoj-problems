<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 172" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14">
  <!-- vals = [4,7,6,9], par = [-1,0,1,2]; best = [26,22,15,9], sum 72 (verified by tree DP over digit masks) -->
  <line x1="101" y1="62" x2="539" y2="62" stroke="#42525e" stroke-width="1.6"/>
  <g stroke="#42525e" stroke-width="1.6" fill="#ffffff">
    <circle cx="80" cy="62" r="21"/>
    <circle cx="240" cy="62" r="21"/>
    <circle cx="400" cy="62" r="21"/>
    <circle cx="560" cy="62" r="21"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#1a2026">
    <text x="80" y="67">4</text>
    <text x="240" y="67">7</text>
    <text x="400" y="67">6</text>
    <text x="560" y="67">9</text>
  </g>
  <g font-size="11.5" fill="#5c6b76" text-anchor="middle">
    <text x="80" y="34">node 0</text>
    <text x="240" y="34">node 1</text>
    <text x="400" y="34">node 2</text>
    <text x="560" y="34">node 3</text>
  </g>
  <g font-size="12" fill="#4169E1" font-weight="600" text-anchor="middle">
    <text x="80" y="108">best = 26</text>
    <text x="240" y="108">best = 22</text>
    <text x="400" y="108">best = 15</text>
    <text x="560" y="108">best = 9</text>
  </g>
  <text x="335" y="152" text-anchor="middle" fill="#1a2026" font-size="13.5">four different single digits, so every node keeps its whole subtree; the scores total 26 + 22 + 15 + 9 = <tspan fill="#4169E1" font-weight="700">72</tspan></text>
</svg>
